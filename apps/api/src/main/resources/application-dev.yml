spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gymsynk
    username: gymsynk
    password: gymsynk_dev
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
  jpa:
    show-sql: false

app:
  jwt:
    secret: dev-secret-gymsynk-change-in-production-must-be-32chars
    access-ttl-minutes: 15
    refresh-ttl-days: 30
  qr:
    token-ttl-seconds: 120
  otp:
    ttl-seconds: 300
    max-requests-per-10min: 3
logging:
  level:
    com.gymsynk: DEBUG
    org.springframework.security: DEBUG
  mail:
    from: GymSynk <noreply@mockline.xyz>
    # from: GymSynk <onboarding@resend.dev> # Resend allows it on the free tier.
    # Set before starting: export RESEND_API_KEY=re_xxxxxxxxxxxxxxxxxxxx
    # The from address must match a verified sender domain in your Resend account.
    # For testing without a verified domain use: onboarding@resend.dev
